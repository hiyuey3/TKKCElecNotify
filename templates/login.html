<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>登录</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("login-form");
            const usernameField = document.getElementById("username");
            const passwordField = document.getElementById("password");
            const rememberMeCheckbox = document.getElementById("remember-me");
            const loginMessage = document.getElementById("login-message");
            const cancelButton = document.getElementById("cancel-auto-login");

            if (!loginForm || !usernameField || !passwordField || !rememberMeCheckbox || !loginMessage || !cancelButton) {
                console.error("未找到某些表单元素，请检查 HTML 代码是否正确！");
                return;
            }

            let autoLoginTimeout = null;

            if (localStorage.getItem("rememberMe") === "true") {
                usernameField.value = localStorage.getItem("username") || "";
                passwordField.value = localStorage.getItem("password") || "";
                rememberMeCheckbox.checked = true;

                loginMessage.style.display = "block";

                autoLoginTimeout = setTimeout(() => {
                    console.log("自动登录执行...");
                    loginForm.submit();
                }, 1800);

                console.log("自动登录定时器 ID:", autoLoginTimeout);
            }

            cancelButton.addEventListener("click", function () {
                if (autoLoginTimeout) {
                    clearTimeout(autoLoginTimeout);
                    autoLoginTimeout = null;
                    console.log("取消自动登录！");
                }
                loginMessage.style.display = "none";
            });

            loginForm.addEventListener("submit", function () {
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem("username", usernameField.value);
                    localStorage.setItem("password", passwordField.value);
                    localStorage.setItem("rememberMe", "true");
                } else {
                    localStorage.removeItem("username");
                    localStorage.removeItem("password");
                    localStorage.setItem("rememberMe", "false");
                }
            });
        });

    </script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: left;
        }

        .li_box, .li_button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /*.login-options {*/
        /*    margin-top: 20px;*/
        /*}*/

        .login-options a {
            display: inline-block;
            font-size: 14px;
            padding: 5px 10px;
            margin: 5px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
        }

        .qq {
            background: #007bff;
        }

        .wechat {
            background: #28a745;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="form-container">
        <h2>使用 教务平台 账号登录<br/> 3TKK平台</h2>

        <form action="/login?way=jw" method="post" id="login-form">
            <input id="username" name="username" placeholder="用户名" required type="text" class="li_box">
            <input id="password" name="password" placeholder="密码" required type="password" class="li_box">
            <label>
                <input id="remember-me" type="checkbox"> 请记住我，并使能自动登录
            </label>
            <button type="submit" class="li_button">登录</button>

        </form>
    </div>
    <div id="login-message"
         style="display: none; background-color: #f8f9fa; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: center;">
        <span>本地缓存将使你2S后自动登录...</span><br/>
        <button id="cancel-auto-login" style="margin-left: 10px; padding: 5px;">取消</button>
    </div>
    <div class="login-options">
        <p>推荐绑定以下方式</p>
        <a class="qq" href="/auth/login?way=qq">使用 QQ 互联登录</a>
        <!--        <br/>-->
        <a class="wechat" href="/auth/login?way=wc">使用 微信 一键登录</a><br/>
        <!--                # <a href="/login?way=wc" class="wechat">使用 微信（PAYJS） 一键登录</a>-->
    </div>

    <p>部分便捷主动服务可能需要：<br/>
        <span style="color:red">将凭据安全的传递给服务器处理
            </span>
        <br/>
        无需担心因数据已经加密</p>
</div>

</body>
